# Déploiement Netlify : « Add new site » → « Import an existing project » →
# choisir ce dépôt. Tout est déjà renseigné ici, rien à saisir.
# Le site est servi à la racine du domaine, donc pas de BASE_PATH.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Application à page unique : toute URL inconnue retombe sur l'accueil.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Fichiers dont le nom porte une empreinte du contenu : un changement produit un nouveau
# nom, jamais une nouvelle version du même fichier. Ils peuvent être gardés pour toujours.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ces trois-là gardent le même nom d'une version à l'autre : ce sont eux qui annoncent
# qu'il y a du neuf. Servis depuis un cache périmé, la mise à jour ne part jamais.
# `sw.js` en premier : c'est le seul fichier que l'application réinterroge d'elle-même.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
