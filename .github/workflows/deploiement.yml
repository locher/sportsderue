# Mise en ligne sur o2switch, déclenchée par une étiquette de version.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Pourquoi une étiquette et pas un push sur `main` : la mise en ligne est le seul geste
# irréversible du projet (une application installée qui reçoit une version cassée n'a pas
# de bouton « recharger »). Une étiquette est une décision explicite, un push non.
#
# ## Deux transports, et pourquoi
#
# **`rsync` par SSH est le défaut**, parce que c'est le meilleur outil : authentification
# par clé (aucun mot de passe à stocker), n'envoie que ce qui a changé, et `--delete` fait
# le ménage proprement.
#
# Son seul risque est en dehors du code : o2switch **filtre SSH par liste blanche
# d'adresses IP**, et les runners GitHub en changent à chaque exécution. Leur documentation
# précise que « les services massivement utilisés, comme par exemple GitHub, Bitbucket […]
# devraient déjà être en liste blanche » — devraient.
#
# On ne parie donc pas dessus : si le secret `O2SWITCH_CPANEL_TOKEN` est renseigné, le
# workflow **autorise l'IP du runner lui-même** juste avant de se connecter et la retire
# après (API cPanel `SshWhitelist`, port 2083, non filtré). C'est le motif que o2switch
# publie dans ses propres workflows d'exemple, et il rend la connexion déterministe. Sans
# ce jeton, l'étape est sautée et on retombe sur le pari.
#
# `test-connexion.yml` répond à la question en lecture seule, sans rien déployer : à lancer
# avant la première étiquette.
#
# **FTPS explicite est le repli**, à activer sans toucher au code : Settings → Secrets and
# variables → Actions → onglet *Variables* → `DEPLOIEMENT_TRANSPORT` = `ftps`. Le port 21
# n'est soumis à aucun filtre (il n'est même pas proposé dans l'outil d'exception pare-feu)
# et il autorise un identifiant au rayon d'impact plus petit : un compte FTP secondaire
# cloisonné sur la racine publique, qui ne peut rien atteindre d'autre. C'est le seul point
# où le repli est *meilleur* que le défaut — en SSH, l'identifiant est celui du compte
# cPanel entier, d'où les garde-fous sur le chemin plus bas.
#
# ## Secrets (Settings → Secrets and variables → Actions)
#
# Transport SSH :
#   O2SWITCH_HOTE          nom d'hôte pour SSH. `identifiant.odns.fr` fait l'affaire, comme
#                          le nom du serveur — SSH ne vérifie aucun certificat, seule la
#                          résolution compte. Éviter une IP nue : elle peut changer, et une
#                          entrée `known_hosts` est liée à la chaîne exacte utilisée ici.
#   O2SWITCH_UTILISATEUR   identifiant cPanel
#   O2SWITCH_CLE_SSH       clé privée dédiée au déploiement, en entier
#   O2SWITCH_HOTES_CONNUS  sortie de `ssh-keyscan <la valeur ci-dessus>` — une entrée pour un
#                          nom ne vaut pas pour l'IP correspondante, ni l'inverse
#   O2SWITCH_RACINE        chemin absolu de la racine publique (/home/xxx/public_html)
#   O2SWITCH_CPANEL_TOKEN  jeton d'API cPanel (facultatif mais conseillé) : il permet au
#                          workflow d'ouvrir le pare-feu pour lui-même. Un jeton se révoque
#                          seul, sans toucher au mot de passe du compte.
#   O2SWITCH_CPANEL_SERVEUR  facultatif, et seulement si l'appel à l'API échoue sur le
#                          certificat : le port 2083 est en HTTPS et vérifie le nom, là où
#                          SSH s'en moque. Y mettre le « Nom du serveur » lu dans cPanel →
#                          Informations générales. Sans ce secret, `O2SWITCH_HOTE` est
#                          réutilisé.
#
# Transport FTPS :
#   O2SWITCH_FTP_HOTE / _UTILISATEUR / _MOTDEPASSE, et
#   O2SWITCH_FTP_RACINE — `/` si le compte FTP est cloisonné sur la racine publique, ce qui
#   rend alors une erreur de chemin impossible.
#
#   Attention pour `O2SWITCH_FTP_HOTE` : le certificat vérifié est celui que présente le
#   serveur FTP, qui porte son propre nom d'hôte (`xxx.o2switch.net`) et pas forcément le
#   domaine. Si la vérification échoue, renseigner le nom d'hôte du serveur plutôt que
#   `sportsderue.fr` — et ne jamais « régler » le problème en désactivant
#   `ssl:verify-certificate`, ce qui reviendrait à chiffrer sans savoir vers qui.

name: Déploiement

on:
  push:
    tags:
      # La convention du dépôt est `v1.2.0`, mais un numéro nu (`1.2.0`) déclenche aussi :
      # une étiquette de version qui ne déploie rien **sans le dire** est exactement le
      # genre de panne muette que ce projet s'efforce d'éviter. Le premier essai s'est
      # perdu comme ça.
      - 'v*'
      - '[0-9]*'
  # Permet de rejouer une mise en ligne sans créer d'étiquette.
  workflow_dispatch:

# Deux mises en ligne simultanées écriraient dans la même racine publique.
concurrency:
  group: deploiement-o2switch
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRANSPORT: ${{ vars.DEPLOIEMENT_TRANSPORT || 'ssh' }}

jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      # Vrai si le jeton d'API cPanel est renseigné. On peut alors autoriser l'IP du runner
      # dans la liste blanche SSH juste avant de déployer et la retirer après, au lieu
      # d'espérer que les plages GitHub y soient déjà. Le secret lui-même n'est pas mis en
      # environnement, seulement le fait qu'il existe.
      PAREFEU: ${{ secrets.O2SWITCH_CPANEL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Vérifier que les secrets du transport retenu sont renseignés
        env:
          HOTE: ${{ secrets.O2SWITCH_HOTE }}
          UTILISATEUR: ${{ secrets.O2SWITCH_UTILISATEUR }}
          CLE_SSH: ${{ secrets.O2SWITCH_CLE_SSH }}
          HOTES_CONNUS: ${{ secrets.O2SWITCH_HOTES_CONNUS }}
          RACINE: ${{ secrets.O2SWITCH_RACINE }}
          FTP_HOTE: ${{ secrets.O2SWITCH_FTP_HOTE }}
          FTP_UTILISATEUR: ${{ secrets.O2SWITCH_FTP_UTILISATEUR }}
          FTP_MOTDEPASSE: ${{ secrets.O2SWITCH_FTP_MOTDEPASSE }}
          FTP_RACINE: ${{ secrets.O2SWITCH_FTP_RACINE }}
        run: |
          echo "Transport : $TRANSPORT"
          case "$TRANSPORT" in
            ssh)  attendus='HOTE UTILISATEUR CLE_SSH HOTES_CONNUS RACINE'; prefixe=O2SWITCH_ ;;
            ftps) attendus='FTP_HOTE FTP_UTILISATEUR FTP_MOTDEPASSE FTP_RACINE'; prefixe=O2SWITCH_ ;;
            *) echo "::error::DEPLOIEMENT_TRANSPORT doit valoir « ssh » ou « ftps », reçu « $TRANSPORT »"; exit 1 ;;
          esac
          manquants=''
          for nom in $attendus; do
            [ -n "${!nom}" ] || manquants="$manquants $prefixe$nom"
          done
          if [ -n "$manquants" ]; then
            echo "::error::Secrets manquants :$manquants"
            exit 1
          fi
          # En SSH l'identifiant est celui du compte cPanel entier : un chemin fautif ferait
          # porter le `--delete` ailleurs. En FTPS le compte est cloisonné, la question ne
          # se pose pas.
          if [ "$TRANSPORT" = ssh ]; then
            case "$RACINE" in
              /*) ;;
              *) echo "::error::O2SWITCH_RACINE doit être un chemin absolu, reçu « $RACINE »"; exit 1 ;;
            esac
          fi

      - run: npm ci

      - run: npm run build

      # Le `.htaccess` porte tout ce que l'hébergeur ne fait pas seul : règles de cache,
      # repli page unique, en-têtes de sécurité. Il est copié après le build, donc jamais
      # précaché par le service worker.
      - name: Joindre le .htaccess au site construit
        run: cp deploy/o2switch/.htaccess dist/.htaccess

      # ------------------------------------------------------------------ transport SSH --
      # o2switch filtre SSH par liste blanche d'adresses IP. Plutôt que d'espérer que celle
      # du runner y soit, on l'ajoute juste avant de passer et on la retire après — c'est le
      # motif que o2switch publie lui-même dans ses workflows d'exemple. Sans le jeton
      # d'API, cette étape est sautée et on retombe sur le pari précédent.
      - name: Autoriser l'IP du runner sur le pare-feu
        if: env.TRANSPORT == 'ssh' && env.PAREFEU == 'true'
        env:
          # Le nom qui marche pour SSH ne vaut pas forcément pour le port 2083, dont le
          # certificat porte le nom du serveur. D'où un secret séparé, facultatif : sans
          # lui on réutilise l'hôte SSH, qui suffit dans le cas le plus courant.
          O2SWITCH_CPANEL_SERVEUR: ${{ secrets.O2SWITCH_CPANEL_SERVEUR || secrets.O2SWITCH_HOTE }}
          O2SWITCH_CPANEL_LOGIN: ${{ secrets.O2SWITCH_UTILISATEUR }}
          O2SWITCH_CPANEL_TOKEN: ${{ secrets.O2SWITCH_CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          ip=$(curl -sS --max-time 15 https://api.ipify.org)
          echo "IP sortante du runner : $ip"
          # Mémorisée pour l'étape de nettoyage, qui tourne même si le déploiement échoue.
          echo "RUNNER_IP=$ip" >> "$GITHUB_ENV"
          if ! scripts/parefeu-o2switch.sh autorise "$ip"; then
            {
              echo "### Pare-feu — ❌ l'ouverture a échoué"
              echo ""
              echo "Trois causes, par ordre de fréquence :"
              echo "- **certificat** — le port 2083 vérifie le nom d'hôte, contrairement à SSH. Renseigner \`O2SWITCH_CPANEL_SERVEUR\` avec le « Nom du serveur » lu dans cPanel → Informations générales."
              echo "- **jeton** — \`O2SWITCH_CPANEL_TOKEN\` invalide, ou \`O2SWITCH_UTILISATEUR\` qui n'est pas l'identifiant cPanel."
              echo "- **plafond** — les 5 exceptions du compte sont déjà prises (cPanel → Autorisation SSH)."
              echo ""
              echo "Le journal de cette étape nomme laquelle : code HTTP, message de curl et corps de la réponse de l'API."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Ouverture du pare-feu impossible, rien n'a été déployé. Voir le résumé du job."
            exit 1
          fi

      - name: Préparer la connexion SSH
        if: env.TRANSPORT == 'ssh'
        env:
          HOTE: ${{ secrets.O2SWITCH_HOTE }}
          UTILISATEUR: ${{ secrets.O2SWITCH_UTILISATEUR }}
          CLE: ${{ secrets.O2SWITCH_CLE_SSH }}
          HOTES_CONNUS: ${{ secrets.O2SWITCH_HOTES_CONNUS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CLE" > ~/.ssh/id_deploiement
          chmod 600 ~/.ssh/id_deploiement
          printf '%s\n' "$HOTES_CONNUS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # Passer par un alias évite de citer des options ssh dans la commande rsync.
          cat > ~/.ssh/config <<CONF
          Host o2switch
            HostName $HOTE
            User $UTILISATEUR
            Port 22
            IdentityFile ~/.ssh/id_deploiement
            IdentitiesOnly yes
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 15
          CONF
          chmod 600 ~/.ssh/config

      - name: Envoyer le site (rsync par SSH)
        if: env.TRANSPORT == 'ssh'
        env:
          RACINE: ${{ secrets.O2SWITCH_RACINE }}
        run: |
          set -euo pipefail
          # Trois tentatives espacées : la documentation d'o2switch dit que l'outil rend la
          # main quand l'exception est effective, mais elle mentionne aussi « quelques
          # secondes ». Un déploiement entier ne doit pas échouer sur cette marge.
          connecte=''
          for essai in 1 2 3; do
            if ssh o2switch true 2>/tmp/ssh.log; then connecte=1; break; fi
            [ "$essai" = 3 ] || { echo "Tentative $essai sans réponse, nouvel essai dans 5 s…"; sleep 5; }
          done
          if [ -z "$connecte" ]; then
            echo "::error::Connexion SSH impossible. Si c'est un délai d'attente, le pare-feu bloque l'IP du runner : renseigner le secret O2SWITCH_CPANEL_TOKEN pour que le workflow l'autorise de lui-même, ou basculer la variable DEPLOIEMENT_TRANSPORT sur « ftps »."
            cat /tmp/ssh.log
            exit 1
          fi
          ssh o2switch "test -d '$RACINE'" \
            || { echo "::error::La racine publique $RACINE n'existe pas sur le serveur"; exit 1; }

          # Premier passage, additif : les fichiers à empreinte doivent tous être en place
          # **avant** que `index.html` et `sw.js` ne les désignent. Sans cette précaution,
          # quelqu'un qui charge la page pendant le transfert reçoit un index qui pointe
          # vers des fichiers absents.
          rsync -rlptz --chmod=D755,F644 \
            --exclude '/index.html' --exclude '/sw.js' --exclude '/manifest.webmanifest' \
            dist/ "o2switch:$RACINE/"

          # Second passage : les trois fichiers à nom stable — ce sont eux qui annoncent la
          # nouvelle version — puis le ménage des fichiers de la version précédente.
          #
          # Les deux exclusions ne sont pas décoratives : `.well-known` sert à la
          # validation du certificat (AutoSSL) et `cgi-bin` est créé par cPanel. Les
          # supprimer casserait le renouvellement du certificat, en silence et des
          # semaines plus tard.
          rsync -rlptz --delete --chmod=D755,F644 \
            --exclude '/.well-known/' --exclude '/cgi-bin/' \
            dist/ "o2switch:$RACINE/"

      # ----------------------------------------------------------------- transport FTPS --
      - name: Installer lftp
        if: env.TRANSPORT == 'ftps'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer le site (FTPS)
        if: env.TRANSPORT == 'ftps'
        env:
          HOTE: ${{ secrets.O2SWITCH_FTP_HOTE }}
          UTILISATEUR: ${{ secrets.O2SWITCH_FTP_UTILISATEUR }}
          # lftp lit le mot de passe dans cette variable avec `--env-password`, ce qui évite
          # de l'écrire dans une ligne de commande.
          LFTP_PASSWORD: ${{ secrets.O2SWITCH_FTP_MOTDEPASSE }}
          RACINE: ${{ secrets.O2SWITCH_FTP_RACINE }}
        run: |
          set -euo pipefail
          lftp -u "$UTILISATEUR" --env-password "ftps://$HOTE" <<LFTP
          # Chiffrement, les trois lignes qui comptent. FTPS explicite démarre en clair et
          # bascule en TLS : un client peut donc « retomber » silencieusement en FTP non
          # chiffré si la bascule échoue — o2switch le signale lui-même à propos de
          # FileZilla. \`ssl-force\` interdit ce repli, \`ssl-protect-data\` chiffre aussi le
          # canal de données (sinon seuls les identifiants le sont, pas les fichiers), et
          # \`verify-certificate\` fait vérifier le certificat : sans elle, le chiffrement ne
          # protège de personne.
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set net:max-retries 3
          set net:timeout 20
          # Sans cette option, LIST n'énumère pas les fichiers cachés : le \`.htaccess\` ne
          # serait jamais envoyé, et tout le contrat de service avec lui.
          set ftp:list-options -a
          set cmd:fail-exit true

          lcd dist
          cd $RACINE

          # Même ordre en deux passages qu'en SSH, et pour la même raison.
          mirror --reverse --parallel=4 --exclude '^(index\.html|sw\.js|manifest\.webmanifest)$'
          mirror --reverse --delete --parallel=4 --exclude '^(\.well-known/|cgi-bin/)'

          bye
          LFTP

      # L'arbitre du dépôt, lancé contre le site réellement servi. Presque rien de ce qui
      # suit ne se voit à l'œil : un `max-age` de trop sur `sw.js` et les mises à jour ne
      # partent plus, sans que l'application cesse de fonctionner.
      - name: Vérifier le contrat de service
        run: npm run verifie-deploiement -- https://sportsderue.fr

      # `always()` : la porte se referme même si le déploiement a échoué en cours de route.
      # Le compte n'a droit qu'à 5 exceptions, une fuite les épuiserait en quelques essais.
      - name: Retirer l'IP du runner du pare-feu
        if: always() && env.TRANSPORT == 'ssh' && env.PAREFEU == 'true' && env.RUNNER_IP != ''
        env:
          # Le nom qui marche pour SSH ne vaut pas forcément pour le port 2083, dont le
          # certificat porte le nom du serveur. D'où un secret séparé, facultatif : sans
          # lui on réutilise l'hôte SSH, qui suffit dans le cas le plus courant.
          O2SWITCH_CPANEL_SERVEUR: ${{ secrets.O2SWITCH_CPANEL_SERVEUR || secrets.O2SWITCH_HOTE }}
          O2SWITCH_CPANEL_LOGIN: ${{ secrets.O2SWITCH_UTILISATEUR }}
          O2SWITCH_CPANEL_TOKEN: ${{ secrets.O2SWITCH_CPANEL_TOKEN }}
        run: scripts/parefeu-o2switch.sh retire "$RUNNER_IP"
