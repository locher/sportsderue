name: Déploiement GitHub Pages

on:
  push:
    branches: [claude/sports-equipment-mapping-france-7gnbnn, main]
  workflow_dispatch:

# Le jeton n'a besoin que de publier sur Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; les pushes suivants remplacent celui en attente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # Pages sert le site sous /<nom-du-dépôt>/ : Vite et le service worker
        # doivent connaître ce préfixe.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Prérequis : Pages activé dans Réglages → Pages avec la source
      # « GitHub Actions » (le jeton du workflow ne peut pas le faire lui-même).
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
