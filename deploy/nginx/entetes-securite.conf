# En-têtes de sécurité, identiques à ceux de `netlify.toml`.
#
# Ce fichier existe à cause d'un piège de nginx, à ne surtout pas contourner en recopiant
# les lignes : **dès qu'un bloc `location` déclare un `add_header`, il perd tous ceux
# hérités du bloc parent**. Comme chaque `location` d'en face pose son propre
# `Cache-Control`, les en-têtes de sécurité disparaîtraient silencieusement de tout ce qui
# n'est pas la page d'accueil. D'où l'inclusion de ce fichier dans *chaque* `location`.
#
# `always` fait poser l'en-tête y compris sur les réponses d'erreur (404, 5xx).
#
# Après toute modification, valider avec :
#   npm run verifie-deploiement -- https://mon-site.fr

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; manifest-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' https://data.geopf.fr https://equipements.sports.gouv.fr" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Netlify posait HSTS de lui-même : hors de chez lui, il faut le déclarer.
# `preload` n'est à garder que si le domaine est réellement soumis à la liste de
# préchargement — sinon l'enlever, il engage pour longtemps.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
