# Sports de rue — service nginx, équivalent de `netlify.toml`.
#
# À adapter : `server_name`, les chemins de certificat, et `root` (où `dist/` est déposé).
# Tout le reste est le contrat lui-même, décrit dans le README (« Contrat de service »).
#
# Une fois en ligne, ne pas se fier à la lecture : `npm run verifie-deploiement -- <url>`.
# Les deux règles qui cassent en silence sont le cache des fichiers à nom stable (les
# mises à jour ne partent plus jamais) et la compression (le JS part quatre fois trop
# lourd) : aucune des deux ne se voit à l'usage depuis une bonne connexion.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name sportsderue.example.fr;

    ssl_certificate     /etc/letsencrypt/live/sportsderue.example.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportsderue.example.fr/privkey.pem;

    root /var/www/sportsderue;
    index index.html;

    # `.webmanifest` n'est pas dans les types livrés avec nginx : sans cette ligne il part
    # en `application/octet-stream`.
    types {
        application/manifest+json  webmanifest;
    }

    # --- Compression ------------------------------------------------------------------
    # Netlify la faisait sans qu'on demande rien. Ici, rien n'est compressé par défaut :
    # le gros morceau est MapLibre, 936 ko bruts contre ~243 ko compressés.
    # Les `.woff2` sont volontairement absents de la liste : déjà compressés, les
    # recompresser ne fait que brûler du processeur.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Si le module brotli est disponible (`ngx_brotli`), décommenter : c'est ce que
    # servait Netlify, ~15 % de mieux que gzip sur ce bundle.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css text/javascript application/javascript application/json
    #              application/manifest+json image/svg+xml;

    # --- Fichiers à empreinte : gardés pour toujours ----------------------------------
    # Leur nom change à chaque contenu, ils ne peuvent donc jamais être périmés.
    location ~ ^/(assets/|workbox-.*\.js$) {
        include /etc/nginx/snippets/sportsderue-entetes-securite.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- Les trois fichiers à nom stable : toujours revalidés -------------------------
    # Ce sont eux qui annoncent qu'il y a du neuf. Un `max-age` ici et l'application
    # installée reste figée sur son ancienne version, sans que rien ne le signale.
    location ~ ^/(sw\.js|index\.html|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/sportsderue-entetes-securite.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    # --- Tout le reste : repli page unique --------------------------------------------
    location / {
        include /etc/nginx/snippets/sportsderue-entetes-securite.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}

# La géolocalisation et le service worker exigent HTTPS : on ne sert rien en clair.
server {
    listen 80;
    listen [::]:80;
    server_name sportsderue.example.fr;
    return 301 https://$host$request_uri;
}
